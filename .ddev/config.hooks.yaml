# Tests run against Postgres because they rely on row locks, jsonb and constraints.
hooks:
  post-start:
    - exec: >-
        PGPASSWORD=db psql -h db -U db -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'testing'" | grep -q 1
        || PGPASSWORD=db psql -h db -U db -d postgres -c 'CREATE DATABASE testing'
