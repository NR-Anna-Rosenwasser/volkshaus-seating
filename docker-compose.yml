x-app: &app
  # Pulled from GHCR on the server. `build` is there for building it locally.
  image: ghcr.io/nr-anna-rosenwasser/volkshaus-seating:${APP_VERSION:-latest}
  build: .
  restart: unless-stopped
  env_file: .env
  environment: &app-environment
    LOG_CHANNEL: stderr

services:
  app:
    <<: *app
    environment:
      <<: *app-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    # Longer than the job timeout, so running jobs can finish.
    stop_grace_period: 130s
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *app-environment
      BACKUP_PATH: /backups
    volumes:
      - backups:/backups
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Append-only, so queued mails survive a restart.
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-seating}
      POSTGRES_USER: ${DB_USERNAME:-seating}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  backups:
